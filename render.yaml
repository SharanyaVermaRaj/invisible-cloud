# One-click setup on Render: New > Blueprint > pick this repository.
services:
  - type: web
    name: invisible-cloud
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: invisible-cloud-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: ANTHROPIC_API_KEY
        sync: false          # Render asks you to paste it during setup
      - key: AI_MODEL
        value: claude-sonnet-5-5

databases:
  - name: invisible-cloud-db
    plan: free
